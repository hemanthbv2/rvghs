<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RV Girls High School — Chatbot</title>
  <link rel="stylesheet" href="index.css?v=5.0" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* 3D Pop-Out Original Garuda with Background Pop Circle Animation Only */
    .chat-launcher {
      position: fixed !important;
      bottom: 24px !important;
      right: 24px !important;
      width: 64px !important;
      height: 64px !important;
      background: transparent !important;
      border: none !important;
      cursor: pointer !important;
      z-index: 9999999 !important;
      padding: 0 !important;
      overflow: visible !important;
      outline: none !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      animation: rvs-float 3.2s ease-in-out infinite !important;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }

    .chat-launcher:hover {
      transform: scale(1.1) !important;
      animation-play-state: paused !important;
    }

    /* The Background Pop Circle: Radiant Purple Wave Pulse Rings */
    .chat-launcher::before {
      content: '' !important;
      position: absolute !important;
      inset: 0 !important;
      border-radius: 50% !important;
      background: #ffffff !important;
      border: 3.5px solid #800080 !important;
      z-index: 1 !important;
      animation: rvs-bg-pop-circle 2.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite !important;
      transition: box-shadow 0.3s ease !important;
    }

    .chat-launcher:hover::before {
      animation-play-state: paused !important;
      box-shadow: 0 0 0 12px rgba(128, 0, 128, 0.3), 0 10px 28px rgba(128, 0, 128, 0.7) !important;
    }

    /* Perfect Original Garuda Head (No Hand, Pure Head Pop-Out) */
    .chat-launcher img.launcher-mascot {
      position: absolute !important;
      width: 96px !important;
      max-width: none !important;
      height: 96px !important;
      top: -20px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      object-fit: contain !important;
      z-index: 2 !important;
      pointer-events: none !important;
      display: block !important;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.22)) !important;
      transition: transform 0.2s ease !important;
    }

    .chat-launcher img.launcher-mascot.thinking-zoom {
      transform: translateX(-50%) scale(1.15) !important;
    }

    /* Background Pop Circle Pulse */
    @keyframes rvs-bg-pop-circle {
      0% {
        box-shadow: 
          0 0 0 0 rgba(128, 0, 128, 0.8),
          0 0 0 0 rgba(128, 0, 128, 0.45),
          0 4px 16px rgba(128, 0, 128, 0.4);
      }
      40% {
        box-shadow: 
          0 0 0 14px rgba(128, 0, 128, 0.35),
          0 0 0 0 rgba(128, 0, 128, 0.45),
          0 6px 20px rgba(128, 0, 128, 0.6);
      }
      70% {
        box-shadow: 
          0 0 0 28px rgba(128, 0, 128, 0),
          0 0 0 14px rgba(128, 0, 128, 0.25),
          0 8px 24px rgba(128, 0, 128, 0.5);
      }
      100% {
        box-shadow: 
          0 0 0 36px rgba(128, 0, 128, 0),
          0 0 0 28px rgba(128, 0, 128, 0),
          0 4px 16px rgba(128, 0, 128, 0.4);
      }
    }

    /* Subtle Levitation Float */
    @keyframes rvs-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>
  <!-- Mock Website Content -->
  <div style="padding: 60px 20px; text-align: center; color: #333; font-family: 'Inter', sans-serif;">
    <h1 style="color: #800080; margin-bottom: 12px;">Welcome to RV Girls High School</h1>
    <p style="color: #666; max-width: 600px; margin: 0 auto; line-height: 1.6;">
      Founded in 1962, empowering young women through holistic education.
      Notice the original Garuda mascot with glowing background pop circle animation in the bottom-right corner!
    </p>
  </div>

  <!-- Floating Launcher with 3D Pop-Out Original Garuda Head & Background Pop Circle -->
  <button class="chat-launcher" id="chatLauncher" title="Chat with us!">
    <img src="garuda_head.png?v=5.0" alt="Chat Mascot" class="launcher-mascot" id="launcherMascotImg">
  </button>

  <!-- Chat Widget -->
  <div class="chat-widget" id="chatWidget">
    <div class="chat-header">
      <div class="header-info">
        <div style="display: flex; align-items: center; gap: 10px;">
          <!-- School Logo -->
          <img src="Logo.png" alt="School Logo" class="header-logo" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: white; padding: 2px;">
          <div>
            <h2 id="chatSchoolName" style="margin: 0; font-size: 16px; font-weight: 600;">RV Girls High School</h2>
            <div class="status"><span class="dot"></span> Online</div>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button id="clearChatBtn" title="Clear chat" style="display: inline-flex; align-items: center; justify-content: center;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg></button>
        <button id="closeChatBtn" title="Close chat">✖</button>
      </div>
    </div>
    <div class="chat-body" id="chatBody" style="position: relative;">
      <!-- Hero Screen -->
      <div id="rvghs-hero-screen" class="hero-screen">
        <img src="mascot_v2.png" alt="Mascot" class="hero-mascot">
        <div class="hero-sign">Welcome to RV Girls High School!</div>
      </div>
      <div class="chat-container" id="chatContainer"></div>
    </div>
    <div class="chat-input-area" style="position: relative;">
      <div class="quick-suggestions" id="quickSuggestions">
        <button class="suggestion-chip" data-query="menu">📋 Menu</button>
        <button class="suggestion-chip" data-query="admissions">📚 Admissions</button>
        <button class="suggestion-chip" data-query="academics">📖 Academics</button>
        <button class="suggestion-chip" data-query="contact">📞 Contact</button>
      </div>
      <div id="typeahead" class="typeahead-container hidden"></div>
      <div class="chat-input-wrapper">
        <button id="micBtn" class="mic-btn" title="Voice Search"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg></button>
        <input type="text" id="chatInput" placeholder="Type a message…" autocomplete="off" />
        <button class="send-btn" id="sendBtn" title="Send">➤</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=5.0"></script>
</body>
</html>
